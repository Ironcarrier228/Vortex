[package]
name = "vortex"
version = "0.1.0"
description = "VORTEX — 3D-центр визуализации данных (сеть / диск / звук)"
authors = ["Vortex"]
edition = "2021"
rust-version = "1.82"
default-run = "vortex"

# Библиотека, чтобы код бэкенда был переиспользуем и тестируем (и mobile_entry_point на будущее).
[lib]
name = "vortex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Общая логика без привязки к платформе (FFT, diff соединений, дерево диска) — с тестами.
vortex-core = { path = "../crates/vortex-core" }

# Быстрый параллельный обход файловой системы.
jwalk = "0.8"

[target.'cfg(windows)'.dependencies]
# Захват системного звука через WASAPI (loopback). Тянет за собой крейт `windows` + windows-core.
wasapi = "0.26"

[features]
# По умолчанию всё включено; фича оставлена для быстрой сборки без аудио (например, на CI без MSVC аудио-тестов).
default = []
